<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Moovee: search any movie or series and watch its trailer instantly." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://www.omdbapi.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <title>Moovee · Search movie trailers</title>
    <link rel="canonical" href="https://mooovee.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moovee" />
    <meta property="og:title" content="Moovee · Search movie trailers" />
    <meta property="og:description" content="Search any movie or series and watch its trailer instantly." />
    <meta property="og:url" content="https://mooovee.vercel.app/" />
    <meta property="og:image" content="https://mooovee.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moovee: search any movie or series and watch its trailer" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('moovee:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Moovee needs JavaScript to search.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
